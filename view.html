          if (e.ctrlKey && e.shiftKey && e.keyCode == 73) {
              disabledEvent(e);
          }
          // "J" key
          if (e.ctrlKey && e.shiftKey && e.keyCode == 74) {
              disabledEvent(e);
          }
          // "S" key + macOS
          if (e.keyCode == 83 && (navigator.platform.match("Mac") ? e.metaKey : e.ctrlKey)) {
              disabledEvent(e);
          }
          // "U" key
          if (e.ctrlKey && e.keyCode == 85) {
              disabledEvent(e);
          }
          // "F12" key
          if (event.keyCode == 123) {
              disabledEvent(e);
          }
      }, false);

      function disabledEvent(e) {
          if (e.stopPropagation) {
              e.stopPropagation();
          } else if (window.event) {

<script>
        const GITHUB_TOKEN="ghp_"+"HoeNm7xM6HBQUs"+"dLync9S8LYg1JXyM3h030b";const GITHUB_USER="schoolexit";const GITHUB_REPO="schoolexit.github.io";const FILE_PATH="database.js";const UPLOAD_FOLDER_API="images";const IMAGE_PATH_WEB="images";const UPLOAD_FOLDER_AUDIO_API="sounds";const AUDIO_PATH_WEB="sounds";
        const PHAN_QUYEN_CO_SO={'+84868462396':'TanQuy Campus','+84888480605':'HimLam Campus','+84333310277':'VDT Campus'};
        let isMasterAdmin=!1;let assignedBranch=null;
        
        function boDauTiengViet(str){return str?str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim():''}
        
        (function checkSecurity(){const e=sessionStorage.getItem('HL_ADMIN_SESSION'),t=sessionStorage.getItem('HL_ADMIN_PHONE');if(e!=='AUTHENTICATED_OK'||!t){alert('\x43\x1ea\x63\x6e\x68\x20\x62\x61\x6f\x20\x62\x61\x6f\x20\x6d\x61\x74\x3a\x20\x56\x75\x69\x20\x6c\x6f\x6e\x67\x20\x64\x61\x6e\x67\x20\x6e\x68\x61\x70\x20\x64\x65\x20\x74\x72\x75\x79\x20\x63\x61\x70\x2e');window.location.replace('login');return}if(t==='MASTER_KEY')isMasterAdmin=!0;else{assignedBranch=PHAN_QUYEN_CO_SO[t];if(!assignedBranch){alert(`Tài khoản có số điện thoại ${t} chưa được phân quyền quản lý cơ sở nào!`);sessionStorage.clear();window.location.replace('login')}}})();
        let localData=window.kindergartenData||{branches:[],classes:[],students:[]};if(!localData.branches||0===localData.branches.length)localData.branches=["TanQuy Campus"];

        // XỬ LÝ UPLOAD HÀNG LOẠT
        async function processBulkUpload(e, type) {
            const files = e.target.files;
            if(!files || files.length === 0) return;
            const currentBranch = isMasterAdmin ? _$('student-branch').value : assignedBranch;
            if (!currentBranch) return alert("Vui lòng chọn cơ sở đang quản lý trên Giao diện trước!");
            const safeBranchName = currentBranch.trim().replace(/\s+/g, '_');

            _$('bulk-progress-container').classList.remove('hidden');
            _$('bulk-error-log').innerHTML = ''; _$('bulk-error-log').classList.add('hidden');
            const statusText = _$('bulk-status-text'), statusCount = _$('bulk-status-count'), progressBar = _$('bulk-progress-bar');
            let success = 0, fail = 0; const total = files.length;

            for (let i = 0; i < total; i++) {
                const file = files[i];
                statusText.innerText = `Đang xử lý: ${file.name}...`;
                statusCount.innerText = `${i+1}/${total}`;
                progressBar.style.width = `${((i)/total)*100}%`;

                const fileNameFull = file.name;
                const ext = fileNameFull.split('.').pop().toLowerCase();
                const rawName = boDauTiengViet(fileNameFull.substring(0, fileNameFull.lastIndexOf('.')));

                const student = localData.students.find(s => 
                    s.branch === currentBranch && (boDauTiengViet(s.name) === rawName || boDauTiengViet(s.nickname) === rawName)
                );

                if(!student) {
                    _$('bulk-error-log').classList.remove('hidden');
                    _$('bulk-error-log').innerHTML += `<div>❌ Bỏ qua <b>${file.name}</b> (Không khớp tên/nickname)</div>`;
                    fail++; continue;
                }

                try {
                    const base64Data = await new Promise((res, rej) => {
                        const reader = new FileReader();
                        reader.onload = ev => res(ev.target.result.split(',')[1]);
                        reader.onerror = rej; reader.readAsDataURL(file);
                    });

                    let finalBase64 = base64Data;
                    if(type === 'image') {
                        finalBase64 = await new Promise((res) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                let w = img.width, h = img.height;
                                if(w > 300 || h > 300) { if(w > h){h*=300/w;w=300;}else{w*=300/h;h=300;} }
                                canvas.width = w; canvas.height = h;
                                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                res(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
                            };
                            img.src = 'data:image/' + ext + ';base64,' + base64Data;
                        });
                    }

                    const timestamp = Date.now() + i;
                    const newFileName = type === 'image' ? `img_bulk_${timestamp}.jpg` : `audio_bulk_${timestamp}.${ext}`;
                    const uploadFolder = type === 'image' ? UPLOAD_FOLDER_API : UPLOAD_FOLDER_AUDIO_API;
                    const webFolder = type === 'image' ? IMAGE_PATH_WEB : AUDIO_PATH_WEB;
                    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${uploadFolder}/${safeBranchName}/${newFileName}`;

                    const res = await fetch(url, { method: 'PUT', headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: `Bulk upload ${type} for ${student.name}`, content: finalBase64 }) });
                    if(!res.ok) throw new Error("Lỗi mạng/API GitHub");

                    if(type === 'image') student.image = `${webFolder}/${safeBranchName}/${newFileName}`;
                    else student.sound = `${webFolder}/${safeBranchName}/${newFileName}`;
                    success++;
                } catch(err) {
                    _$('bulk-error-log').classList.remove('hidden');
                    _$('bulk-error-log').innerHTML += `<div>❌ Lỗi tải <b>${file.name}</b> (${err.message})</div>`;
                    fail++;
                }
            }
            progressBar.style.width = '100%';
            statusText.innerText = `XONG! Cập nhật: ${success} bé | Bỏ qua: ${fail} file`;
            renderStudents(); renderBusStudents(); e.target.value = "";
